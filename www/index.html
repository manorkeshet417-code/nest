<title>קן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: iOS-style family network. Content layer = cards and grouped lists on a grouped background.
   Functional layer = Liquid Glass (tab bar, nav bar once scrolled, chat bar, sheets).
   Each group carries its own color, which becomes the accent inside it. */
:root{
  --bg:#f2f2f7; --bg2:#ffffff; --bg3:#e9e9ee; --label:#000000; --label2:#6c6c70; --label3:#8e8e93;
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.1);
  --glass:rgba(250,250,252,.74); --glass-edge:rgba(255,255,255,.75); --glass-shadow:0 10px 30px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
  --scrim:rgba(0,0,0,.3); --desk:#d8d8de; --bezel:#1c1c1e; --island:#000000; --viewer:#000000;
  --g-orange:#c93400; --g-blue:#0066cc; --g-green:#248a3d; --g-pink:#d30f45; --g-purple:#8944ab; --g-teal:#0071a4;
  --accent:var(--g-orange); --on-accent:#ffffff; --red:#d70015; --heart:#ff2d55; --ok:#248a3d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo","Segoe UI",Roboto,system-ui,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Heebo",system-ui,sans-serif;
  --r-card:22px; --r-list:26px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg2:#1c1c1e; --bg3:#2c2c2e; --label:#ffffff; --label2:#aeaeb2; --label3:#8e8e93;
    --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24);
    --glass:rgba(38,38,42,.64); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 30px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.55); --desk:#0b0b0d; --bezel:#2c2c30;
    --g-orange:#ff9f0a; --g-blue:#0a84ff; --g-green:#30d158; --g-pink:#ff375f; --g-purple:#bf5af2; --g-teal:#64d2ff;
    --on-accent:#000000; --red:#ff453a; --heart:#ff375f; --ok:#30d158; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#1c1c1e; --bg3:#2c2c2e; --label:#ffffff; --label2:#aeaeb2; --label3:#8e8e93;
  --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24);
  --glass:rgba(38,38,42,.64); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 30px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --desk:#0b0b0d; --bezel:#2c2c30;
  --g-orange:#ff9f0a; --g-blue:#0a84ff; --g-green:#30d158; --g-pink:#ff375f; --g-purple:#bf5af2; --g-teal:#64d2ff;
  --on-accent:#000000; --red:#ff453a; --heart:#ff375f; --ok:#30d158; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:var(--label)}
form{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* ---------- iPhone frame (wide screens only, never when installed) ---------- */
.statusbar,.stage-note,.island{display:none}
@media (min-width:600px) and (min-height:640px){
  :root:not(.native) body{background:var(--desk)}
  :root:not(.native) body::before{display:none}
  :root:not(.native) .stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px}
  :root:not(.native) .phone{position:relative;transform:translateZ(0);width:393px;max-width:100%;height:min(852px,calc(100vh - 90px));border:12px solid var(--bezel);border-radius:60px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 2px color-mix(in srgb,var(--bezel) 60%,var(--label3)),0 40px 80px -30px rgba(0,0,0,.5)}
  :root:not(.native) .statusbar{display:flex;justify-content:space-between;align-items:center;height:50px;padding:6px 32px 0;font-family:var(--font-num);font-weight:600;font-size:16px;position:absolute;inset:0 0 auto;z-index:30;pointer-events:none}
  :root:not(.native) .island{display:block;position:absolute;left:50%;top:11px;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:var(--island);z-index:40}
  :root:not(.native) .screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  :root:not(.native) .screen::-webkit-scrollbar{display:none}
  :root:not(.native) .navbar{top:0;padding-top:50px}
  :root:not(.native) #app.bare{padding-top:50px}
  :root:not(.native) .stage-note{display:block;color:var(--label2);font-size:13px;text-align:center;max-width:393px}
  :root:not(.native) .hud{top:6px}
}
.sb-icons{display:flex;gap:6px;align-items:center}

#app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
#app.bare{padding-bottom:40px}
#app.chat-pad{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* ---------- navigation bar ---------- */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(8px,env(safe-area-inset-left,0px));transition:background-color .2s,box-shadow .2s}
.nb-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:50px}
.nb-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;display:flex;align-items:center;gap:6px}
.navbar.inline .nb-title,.navbar.scrolled .nb-title{opacity:1}
.navbar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 .5px 0 var(--sep)}
.nb-lead{justify-self:start;display:flex}
.nb-trail{justify-self:end;display:flex;gap:2px;align-items:center}
.nb-btn{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px;color:var(--accent);font-size:17px;border-radius:22px;justify-content:center}
.nb-btn:active{opacity:.4}
.large{padding:2px 4px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.large h1{font-size:34px;line-height:41px;font-weight:700;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* ---------- lists ---------- */
.section-h{font-size:13px;color:var(--label2);padding:20px 16px 7px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-h:first-child{padding-top:4px}
.section-f{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.4}
.list{background:var(--bg2);border-radius:var(--r-list);overflow:hidden}
.list>*{position:relative}
.list>*+*::after{content:"";position:absolute;top:0;inset-inline-start:var(--inset,16px);inset-inline-end:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep);z-index:3;pointer-events:none}
.list.av{--inset:68px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;width:100%;background:var(--bg2)}
button.row:active{background:var(--fill2)}
.row .body{flex:1;min-width:0}
.row .t{font-size:17px;overflow-wrap:anywhere}
.row .sub{display:block;font-size:14px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--label2);font-size:14px;white-space:nowrap}
.row.center{justify-content:center}
.row.blue{color:var(--accent);justify-content:center}
.row.red{color:var(--red);justify-content:center}
.chev{color:var(--label3);flex:none}
.field{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;background:var(--bg2)}
.field label{flex:none;min-width:70px;font-size:17px}
.field input,.field textarea{flex:1;min-width:0;border:0;background:none;font-size:17px;min-height:40px;outline:none;padding:0}
.field input::placeholder,.field textarea::placeholder,.composer textarea::placeholder,.chat-bar textarea::placeholder{color:var(--label3)}

/* avatars & group tiles */
.av-img{border-radius:50%;object-fit:cover;flex:none;background:var(--fill)}
.av-ini{border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-weight:600;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c))}
.gtile{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:28px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.gtile.lg{width:84px;height:84px;border-radius:22px;font-size:46px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--label2);margin-inline-start:6px;vertical-align:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:600;background:var(--fill);color:var(--label)}
.btn:active{opacity:.6}
.btn.filled{background:var(--accent);color:var(--on-accent)}
.btn.tinted{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row>.btn{flex:1}
.icon-btn{width:44px;height:44px;flex:none;display:inline-grid;place-items:center;border-radius:50%;color:var(--accent)}
.icon-btn:active{background:var(--fill2)}
.icon-btn.muted{color:var(--label3)}

/* ---------- glass tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.tabbar::before{content:"";position:absolute;inset:-30px 0 0;background:linear-gradient(to top,var(--bg) 20%,transparent);pointer-events:none;opacity:.9}
.tb-in{position:relative;pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;border-radius:999px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:999px;color:var(--label);font-size:10.5px;font-weight:600;min-height:54px;justify-content:center;position:relative}
.tab.on{color:var(--accent);background:var(--fill2)}
.tab .dot{position:absolute;top:6px;inset-inline-end:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* ---------- login ---------- */
.onb{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:30px;gap:10px}
.onb h1{font-size:40px;font-weight:800;line-height:1.1;margin-top:10px}
.onb .lead{color:var(--label2);font-size:17px;max-width:30ch;line-height:1.4}
.features{display:flex;flex-direction:column;gap:18px;margin:28px 8px 10px;text-align:start}
.feature{display:flex;gap:14px;align-items:flex-start}
.feature .fi{width:40px;flex:none;color:var(--accent);display:grid;place-items:center}
.feature b{display:block;font-size:15px}
.feature span{font-size:15px;color:var(--label2);line-height:1.35}
.app-icon{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#ffb35c,#e8590c);box-shadow:0 12px 26px -10px rgba(232,89,12,.7)}
.err{color:var(--red);font-size:13px;padding:7px 16px 0}
.loading{display:grid;place-items:center;min-height:70vh}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--label2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px;color:var(--label2)}
.empty b{color:var(--label);font-size:20px}
.empty svg{color:var(--label3)}

/* ---------- feed ---------- */
.composer{background:var(--bg2);border-radius:var(--r-card);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.composer .top{display:flex;gap:10px;align-items:flex-start}
.composer textarea{flex:1;min-width:0;border:0;background:none;outline:none;resize:none;font-size:17px;line-height:1.4;padding:7px 0;min-height:38px;max-height:200px}
.composer .bar{display:flex;justify-content:space-between;align-items:center}
.prev{position:relative;border-radius:14px;overflow:hidden;max-height:260px}
.prev img{display:block;width:100%;max-height:260px;object-fit:cover}
.prev button{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.posts{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.post{background:var(--bg2);border-radius:var(--r-card);overflow:hidden}
.post header{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.post header .who{flex:1;min-width:0}
.post header b{display:block;font-size:15px}
.post header span{font-size:13px;color:var(--label2)}
.post-text{padding:0 14px 10px;font-size:17px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.post-img{background:var(--fill2);max-height:520px;overflow:hidden;display:block;width:100%}
.post-img img{display:block;width:100%;height:100%;object-fit:cover}
.post footer{display:flex;gap:4px;padding:6px 8px}
.act{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:999px;color:var(--label2);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.act:active{background:var(--fill2)}
.act.on{color:var(--heart)}
.act.on svg{fill:currentColor}
.likers{font-size:13px;color:var(--label2);padding:0 14px 12px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.day-sep{text-align:center;margin:14px 0 8px}
.day-sep span{font-size:12px;font-weight:600;color:var(--label2);background:var(--fill2);padding:4px 10px;border-radius:999px}
.msg{display:flex;gap:6px;align-items:flex-end}
.msg.first{margin-top:8px}
.msg.mine{justify-content:flex-end}
.msg-av{width:28px;flex:none}
.bubble{max-width:78%;padding:7px 12px 6px;border-radius:19px;background:var(--bg2);font-size:17px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine .bubble{background:var(--accent);color:var(--on-accent)}
.msg-name{font-size:13px;font-weight:700;margin-bottom:1px}
.msg-time{display:block;font-size:11px;opacity:.6;margin-top:2px;text-align:end;font-variant-numeric:tabular-nums}
.chat-bar{position:fixed;left:0;right:0;z-index:9;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;width:calc(100% - 28px);display:flex;gap:8px;align-items:flex-end;padding:6px 6px 6px 6px;border-radius:24px}
.chat-bar textarea{flex:1;min-width:0;border:0;background:none;outline:none;resize:none;font-size:17px;line-height:1.35;padding:8px 10px;max-height:120px}
.send{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.send:disabled{opacity:.35}

/* ---------- events ---------- */
.events{display:flex;flex-direction:column;gap:12px}
.ev{background:var(--bg2);border-radius:var(--r-card);padding:14px;display:flex;gap:14px;align-items:flex-start}
.ev-date{width:56px;flex:none;border-radius:14px;overflow:hidden;text-align:center;background:var(--fill2)}
.ev-date .m{display:block;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;padding:3px 0}
.ev-date .d{display:block;font-family:var(--font-num);font-size:26px;font-weight:600;padding:4px 0 6px;font-variant-numeric:tabular-nums}
.ev .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ev b{font-size:17px}
.ev .sub{font-size:14px;color:var(--label2)}
.ev .when{font-size:13px;font-weight:700;color:var(--accent)}
.seg{display:flex;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;margin-top:6px}
.seg button{flex:1;min-height:32px;border-radius:7px;font-size:14px;font-weight:600}
.seg button.on{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.14);color:var(--accent)}
.ev.past{opacity:.6}

/* ---------- album ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:18px;overflow:hidden}
.grid button{aspect-ratio:1;background:var(--fill2);overflow:hidden;display:block}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:fixed;inset:0;z-index:70;background:var(--viewer);color:#fff;display:flex;flex-direction:column}
.viewer .vt{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 6px}
:root:not(.native) .viewer .vt{padding-top:54px}
.viewer .vt button{color:#fff}
.viewer .vimg{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.viewer .vinfo{padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));font-size:14px;color:rgba(255,255,255,.75);text-align:center}

/* ---------- members ---------- */
.invite{background:var(--bg2);border-radius:var(--r-card);padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.code{font-family:var(--font-num);font-size:34px;font-weight:700;letter-spacing:.18em;direction:ltr;color:var(--accent);font-variant-numeric:tabular-nums}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg2)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--c)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:42px;height:42px;border-radius:12px;font-size:24px;display:grid;place-items:center;background:var(--fill2)}
.emojis button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}

/* ---------- sheets & HUD ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.asheet{position:fixed;left:0;right:0;bottom:0;z-index:51;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
.asheet.show{transform:none}
.ag{border-radius:22px;overflow:hidden}
.am{padding:16px 18px;text-align:center;font-size:13px;color:var(--label2);line-height:1.4}
.am b{display:block;color:var(--label);font-size:15px;margin-bottom:3px}
.aa{display:block;width:100%;min-height:58px;font-size:20px;text-align:center;color:var(--accent);border-top:.5px solid var(--sep)}
.aa.destructive{color:var(--red)}
.aa.cancel{border:0;font-weight:600;border-radius:22px}
.aa:active{background:var(--fill2)}

async function LiveBackend(cfg){
  const B='https://www.gstatic.com/firebasejs/11.0.2/';
  const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const fb=A.initializeApp(cfg),auth=Au.getAuth(fb);
  let db;try{db=F.initializeFirestore(fb,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(fb)}
  const {doc,collection,query,where,orderBy,limit,onSnapshot,getDoc,setDoc,updateDoc,addDoc,serverTimestamp,arrayUnion,arrayRemove,increment,writeBatch}=F;
  const ms=v=>v&&v.toMillis?v.toMillis():(typeof v==='number'?v:Date.now());
  const read=d=>{const x=d.data({serverTimestamps:'estimate'});x.id=d.id;if('createdAt' in x)x.createdAt=ms(x.createdAt);if('lastAt' in x)x.lastAt=ms(x.lastAt);return x};
  const ucache={};let me=null;
  const touch=(gid,text)=>updateDoc(doc(db,'groups',gid),{lastMessage:text.slice(0,80),lastAt:serverTimestamp()}).catch(()=>{});
  const order={posts:['createdAt','desc',60],messages:['createdAt','desc',200],events:['date','asc',100],images:['createdAt','desc',150]};
  return {
    mode:'live',
    onAuth(cb){return Au.onAuthStateChanged(auth,async u=>{
      if(!u){me=null;cb(null);return}
      const ref=doc(db,'users',u.uid);let saved=null;try{const s=await getDoc(ref);if(s.exists())saved=s.data()}catch(e){}
      const data={name:(saved&&saved.name)||u.displayName||'',photo:u.photoURL||''};
      try{await setDoc(ref,data,{merge:true})}catch(e){}
      me=Object.assign({id:u.uid},data);ucache[u.uid]=me;cb(Object.assign({},me))})},
    async signIn(){const p=new Au.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
      try{await Au.signInWithPopup(auth,p)}catch(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))await Au.signInWithRedirect(auth,p);else throw e}},
    signOut(){return Au.signOut(auth)},
    async saveProfile(o){await setDoc(doc(db,'users',me.id),o,{merge:true});Object.assign(me,o);ucache[me.id]=me},
    async users(ids){await Promise.all(ids.filter(i=>!ucache[i]).map(async i=>{try{const s=await getDoc(doc(db,'users',i));ucache[i]=s.exists()?Object.assign({id:i},s.data()):{id:i,name:''}}catch(e){ucache[i]={id:i,name:''}}}));const o={};ids.forEach(i=>o[i]=ucache[i]);return o},
    watchGroups(cb,err){return onSnapshot(query(collection(db,'groups'),where('members','array-contains',me.id)),s=>cb(s.docs.map(read)),err)},
    async createGroup(o){const ref=doc(collection(db,'groups')),code=newCode(),b=writeBatch(db);
      b.set(ref,{name:o.name,emoji:o.emoji,color:o.color,ownerId:me.id,members:[me.id],inviteCode:code,createdAt:serverTimestamp(),lastAt:serverTimestamp(),lastMessage:''});
      b.set(doc(db,'invites',code),{groupId:ref.id,groupName:o.name,emoji:o.emoji,color:o.color});await b.commit();return ref.id},
    async findInvite(code){const s=await getDoc(doc(db,'invites',code));return s.exists()?s.data():null},
    joinGroup(code,gid){return updateDoc(doc(db,'groups',gid),{members:arrayUnion(me.id),joinCode:code})},
    async updateGroup(g,p){const b=writeBatch(db);b.update(doc(db,'groups',g.id),p);const ip={};if('name' in p)ip.groupName=p.name;if('emoji' in p)ip.emoji=p.emoji;if('color' in p)ip.color=p.color;if(Object.keys(ip).length)b.update(doc(db,'invites',g.inviteCode),ip);await b.commit()},
    async newInviteCode(g){const code=newCode(),b=writeBatch(db);b.delete(doc(db,'invites',g.inviteCode));b.set(doc(db,'invites',code),{groupId:g.id,groupName:g.name,emoji:g.emoji,color:g.color});b.update(doc(db,'groups',g.id),{inviteCode:code});await b.commit();return code},
    removeMember(gid,u){return updateDoc(doc(db,'groups',gid),{members:arrayRemove(u)})},
    leaveGroup(gid){return updateDoc(doc(db,'groups',gid),{members:arrayRemove(me.id)})},
    async deleteGroup(g){const b=writeBatch(db);b.delete(doc(db,'invites',g.inviteCode));b.delete(doc(db,'groups',g.id));await b.commit()},
    watch(gid,kind,cb,err){const o=order[kind];return onSnapshot(query(collection(db,'groups',gid,kind),orderBy(o[0],o[1]),limit(o[2])),s=>cb(s.docs.map(read)),err)},
    watchComments(gid,pid,cb,err){return onSnapshot(query(collection(db,'groups',gid,'posts',pid,'comments'),orderBy('createdAt','asc'),limit(300)),s=>cb(s.docs.map(read)),err)},
    async addPhoto(gid,img){const ref=doc(collection(db,'groups',gid,'images')),b=writeBatch(db);
      b.set(doc(db,'groups',gid,'imageData',ref.id),{by:me.id,data:img.full.data});
      b.set(ref,{by:me.id,thumb:img.thumb.data,w:img.full.w,h:img.full.h,createdAt:serverTimestamp()});await b.commit();return ref.id},
    async addPhotos(gid,imgs){for(const im of imgs)await this.addPhoto(gid,im);touch(gid,`${me.name} הוסיף/ה ${imgs.length===1?'תמונה':imgs.length+' תמונות'} לאלבום`)},
    async addPost(gid,o){const imageId=o.image?await this.addPhoto(gid,o.image):'';
      await addDoc(collection(db,'groups',gid,'posts'),{authorId:me.id,text:o.text||'',imageId:imageId,createdAt:serverTimestamp(),likes:[],commentCount:0});
      touch(gid,o.text?`${me.name}: ${o.text}`:`${me.name} שיתף/ה תמונה`)},
    toggleLike(gid,p){return updateDoc(doc(db,'groups',gid,'posts',p.id),{likes:p.likes.includes(me.id)?arrayRemove(me.id):arrayUnion(me.id)})},
    async deletePost(gid,p){const b=writeBatch(db);b.delete(doc(db,'groups',gid,'posts',p.id));if(p.imageId){b.delete(doc(db,'groups',gid,'images',p.imageId));b.delete(doc(db,'groups',gid,'imageData',p.imageId))}await b.commit()},
    async addComment(gid,pid,text){const b=writeBatch(db);b.set(doc(collection(db,'groups',gid,'posts',pid,'comments')),{authorId:me.id,text:text,createdAt:serverTimestamp()});b.update(doc(db,'groups',gid,'posts',pid),{commentCount:increment(1)});await b.commit()},
    async deleteComment(gid,pid,cid){const b=writeBatch(db);b.delete(doc(db,'groups',gid,'posts',pid,'comments',cid));b.update(doc(db,'groups',gid,'posts',pid),{commentCount:increment(-1)});await b.commit()},
    async sendMessage(gid,text){await addDoc(collection(db,'groups',gid,'messages'),{authorId:me.id,text:text,createdAt:serverTimestamp()});touch(gid,`${me.name}: ${text}`)},
    async addEvent(gid,o){await addDoc(collection(db,'groups',gid,'events'),Object.assign({createdBy:me.id,rsvp:{[me.id]:'yes'},createdAt:serverTimestamp()},o));touch(gid,`${me.name} הוסיף/ה אירוע: ${o.title}`)},
    rsvp(gid,eid,v){return updateDoc(doc(db,'groups',gid,'events',eid),{['rsvp.'+me.id]:v})},
    deleteEvent(gid,eid){const b=writeBatch(db);b.delete(doc(db,'groups',gid,'events',eid));return b.commit()},
    async imageData(gid,iid){const s=await getDoc(doc(db,'groups',gid,'imageData',iid));return s.exists()?s.data().data:''},
    async deleteImage(gid,img){const b=writeBatch(db);b.delete(doc(db,'groups',gid,'images',img.id));b.delete(doc(db,'groups',gid,'imageData',img.id));await b.commit()}
  };
}

  document.querySelectorAll('[data-draft]').forEach(el=>{el.value=S.drafts[el.dataset.draft]||'';grow(el)});

  if(fid&&!navigated){const n=document.getElementById(fid);if(n){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  if(navigated){scrollTo(0);if(S.screen==='group'&&S.tab==='chat')requestAnimationFrame(()=>scrollTo(scrollMax()))}
  else if(S.screen==='group'&&S.tab==='chat'&&(nearBottom||chatChanged&&isMineLatest()))requestAnimationFrame(()=>scrollTo(scrollMax()));
  else scrollTo(y);
  onScroll();loadFullImages();
}

  });

    async onOk(f){const name=f.querySelector('#gf-name').value.trim();if(!name){hud('תנו שם לקבוצה',true);f.querySelector('#gf-name').focus();return false}
      if(g){await be.updateGroup(g,{name:name,emoji:emoji,color:color});hud('נשמר')}
      else{const gid=await be.createGroup({name:name,emoji:emoji,color:color});haptic(15);hud('הקבוצה נוצרה');setTimeout(()=>go('group',gid),300)}}});
  const prev=()=>{fs.querySelector('#gf-prev').innerHTML=gtile({emoji:emoji,color:color},'lg')};prev();
  fs.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{emoji=b.dataset.e;fs.querySelectorAll('[data-e]').forEach(x=>x.setAttribute('aria-pressed',x===b));prev()});
  fs.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;fs.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b));prev()});
}
function joinForm(code){
  let found=null;
  const fs=formSheet({title:'הצטרפות לקבוצה',action:'הצטרפות',
    body:`<div class="section-h">קוד הזמנה</div><div class="list"><div class="field"><input id="jf-code" maxlength="6" placeholder="למשל KEN482" value="${esc(code||'')}" aria-label="קוד הזמנה" autocapitalize="characters" autocomplete="off" spellcheck="false" dir="ltr" style="text-align:left;letter-spacing:.15em;font-weight:600" autofocus></div></div>
      <p class="section-f">את הקוד מקבלים ממי שפתח את הקבוצה, במסך "חברים".</p><div id="jf-res" style="margin-top:16px"></div>`,
    async onOk(f){
      if(!found){await look();if(!found)return false}
      if(S.groups.some(g=>g.id===found.groupId)){hud('את/ה כבר בקבוצה הזו');setTimeout(()=>go('group',found.groupId),300);return}
      await be.joinGroup(found.code,found.groupId);haptic(15);hud(`הצטרפת ל${found.groupName}`);
      if(params.has('join')){params.delete('join');history.replaceState(null,'',location.pathname+(params.toString()?'?'+params:''))}
      setTimeout(()=>go('group',found.groupId),500)}});
  const inp=fs.querySelector('#jf-code'),res=fs.querySelector('#jf-res');
  async function look(){
    const c=inp.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');found=null;
    if(c.length!==6){res.innerHTML='';if(c.length)hud('הקוד צריך להיות 6 תווים',true);return}
    res.innerHTML='<div class="loading" style="min-height:60px"><div class="spinner"></div></div>';
    try{const inv=await be.findInvite(c);
      if(!inv){res.innerHTML='<p class="err" style="text-align:center">לא מצאנו קבוצה עם הקוד הזה. בדקו אותו ונסו שוב.</p>';return}
      found=Object.assign({code:c},inv);
      res.innerHTML=`<div class="invite">${gtile({emoji:inv.emoji,color:inv.color},'lg')}<b style="font-size:20px">${esc(inv.groupName)}</b><span style="color:var(--label2);font-size:14px">לחצו "הצטרפות" למעלה כדי להיכנס.</span></div>`}
    catch(e){res.innerHTML='';fail(e)}}
  inp.addEventListener('input',()=>{inp.value=inp.value.toUpperCase();if(inp.value.replace(/[^A-Z0-9]/g,'').length===6)look();else{found=null;res.innerHTML=''}});
  if(code&&code.length===6)look();
}
function eventForm(){
  const d=new Date();d.setDate(d.getDate()+(5-d.getDay()+7)%7||7);
  formSheet({title:'אירוע חדש',action:'הוספה',
    body:`<div class="section-h">פרטים</div><div class="list">
      <div class="field"><label for="ef-t">מה</label><input id="ef-t" maxlength="60" placeholder="ארוחת שישי" autofocus></div>
      <div class="field"><label for="ef-d">תאריך</label><input id="ef-d" type="date" value="${iso(d)}"></div>
      <div class="field"><label for="ef-h">שעה</label><input id="ef-h" type="time" value="19:30"></div>
      <div class="field"><label for="ef-p">איפה</label><input id="ef-p" maxlength="80" placeholder="אצל סבתא"></div></div>
      <p class="section-f">כל חברי הקבוצה יראו את האירוע ויוכלו לאשר הגעה.</p>`,
    async onOk(f){const t=f.querySelector('#ef-t').value.trim(),date=f.querySelector('#ef-d').value;
      if(!t){hud('כתבו מה האירוע',true);return false}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){hud('בחרו תאריך',true);return false}
      await be.addEvent(S.gid,{title:t,date:date,time:f.querySelector('#ef-h').value||'',place:f.querySelector('#ef-p').value.trim()});haptic(12);hud('האירוע נוסף')}});
}

/* ---------- actions ---------- */
const A={
  google:async b=>{b.disabled=true;try{await be.signIn()}catch(e){if(!(e&&e.code==='auth/popup-closed-by-user'||e&&e.code==='auth/cancelled-popup-request'))fail(e)}finally{b.disabled=false}},
  back:()=>{if(history.state&&history.state.screen&&history.state.screen!=='groups')history.back();else go('groups')},
  profile:()=>go('profile'),
  open:b=>go('group',b.dataset.v),
  tab:b=>{if(S.tab===b.dataset.v){scrollTo(S.tab==='chat'?scrollMax():0);return}S.tab=b.dataset.v;if(S.tab==='chat')markSeen();S.anim='fade';render(true)},
  'new-group':()=>groupForm(null),
  join:()=>joinForm(''),
  'edit-group':()=>groupForm(group()),
  pick:b=>{S.pickFor=b.dataset.v;fileEl.multiple=b.dataset.v==='album';fileEl.value='';fileEl.click()},
  'clear-img':()=>{S.img=null;render()},
  like:async b=>{const p=S.data.posts.find(x=>x.id===b.dataset.v);if(!p)return;haptic();try{await be.toggleLike(S.gid,p)}catch(e){fail(e)}},
  comments:b=>openComments(b.dataset.v),
  'del-comment':async b=>{const pid=S.comments&&S.comments.pid;if(!pid)return;try{await be.deleteComment(S.gid,pid,b.dataset.v)}catch(e){fail(e)}},
  'post-menu':async b=>{const p=S.data.posts.find(x=>x.id===b.dataset.v);if(!p)return;
    if(await confirmSheet({title:'למחוק את הפוסט?',msg:p.imageId?'גם התמונה תימחק מהאלבום.':'',actions:[{label:'מחיקת הפוסט',destructive:true}]})===0){try{await be.deletePost(S.gid,p);hud('הפוסט נמחק')}catch(e){fail(e)}}},
  'view-img':b=>{S.viewer={id:b.dataset.v};renderViewer();const c=$('.viewer [data-a=viewer-close]');if(c)c.focus({preventScroll:true})},
  'viewer-close':()=>{S.viewer=null;renderViewer()},
  'viewer-step':b=>{const l=S.data.images,i=l.findIndex(x=>x.id===S.viewer.id)+ +b.dataset.v;if(l[i]){S.viewer.id=l[i].id;renderViewer()}},
  'viewer-del':async()=>{const im=S.data.images.find(x=>x.id===S.viewer.id);if(!im)return;
    if(await confirmSheet({title:'למחוק את התמונה?',msg:'היא תימחק מהאלבום של כל הקבוצה.',actions:[{label:'מחיקת התמונה',destructive:true}]})===0){try{await be.deleteImage(S.gid,im);hud('התמונה נמחקה');A['viewer-close']()}catch(e){fail(e)}}},
  rsvp:async b=>{haptic();try{await be.rsvp(S.gid,b.dataset.v,b.dataset.r)}catch(e){fail(e)}},
  'new-event':()=>eventForm(),
  'event-menu':async b=>{const e=S.data.events.find(x=>x.id===b.dataset.v);if(!e)return;
    if(await confirmSheet({title:e.title,actions:[{label:'מחיקת האירוע',destructive:true}]})===0){try{await be.deleteEvent(S.gid,e.id);hud('האירוע נמחק')}catch(x){fail(x)}}},
  'share-invite':async()=>{const g=group(),url=inviteLink(g),text=`הצטרפו לקבוצה "${g.name}" בקן. קוד ההזמנה: ${g.inviteCode}`;
    if(navigator.share){try{await navigator.share({title:'הזמנה לקן',text:text,url:url});return}catch(e){if(e&&e.name==='AbortError')return}}copyText(text+'\n'+url)},
  'copy-invite':()=>{const g=group();copyText(inviteLink(g))},
  'member-menu':async b=>{const g=group(),m=S.members[b.dataset.v]||{};
    if(await confirmSheet({title:nameOf(m),msg:'הוצאה מהקבוצה מבטלת את הגישה שלו/ה לפיד, לצ׳אט ולאלבום.',actions:[{label:'הוצאה מהקבוצה',destructive:true}]})===0){try{await be.removeMember(g.id,b.dataset.v);hud(`${first(nameOf(m))} הוצא/ה מהקבוצה`)}catch(e){fail(e)}}},
  'new-code':async()=>{const g=group();if(await confirmSheet({title:'להחליף את קוד ההזמנה?',msg:'הקישור הישן יפסיק לעבוד.',actions:[{label:'החלפת הקוד'}]})===0){try{await be.newInviteCode(g);hud('קוד חדש נוצר')}catch(e){fail(e)}}},
  'delete-group':async()=>{const g=group();if(await confirmSheet({title:`למחוק את "${g.name}"?`,msg:'הקבוצה תיעלם לכל החברים, עם הפיד, הצ׳אט, האירועים והאלבום. אי אפשר לבטל.',actions:[{label:'מחיקת הקבוצה',destructive:true}]})===0){try{await be.deleteGroup(g);go('groups');hud('הקבוצה נמחקה')}catch(e){fail(e)}}},
  'leave-group':async()=>{const g=group();if(await confirmSheet({title:`לצאת מ"${g.name}"?`,msg:'כדי לחזור תצטרכו קוד הזמנה חדש.',actions:[{label:'יציאה מהקבוצה',destructive:true}]})===0){try{await be.leaveGroup(g.id);go('groups');hud('יצאת מהקבוצה')}catch(e){fail(e)}}},
  'sign-out':async()=>{if(await confirmSheet({title:'להתנתק?',msg:be.mode==='live'?'הקבוצות שלך נשארות. אפשר להיכנס שוב עם Google.':'במצב דמו הכול יתחיל מחדש.',actions:[{label:'התנתקות'}]})===0){closeGroup();if(unsubGroups)unsubGroups();unsubGroups=null;await be.signOut()}}
};
const F={
  'demo-login':async()=>{const n=$('#demo-name').value.trim();if(!n){$('#demo-name').focus();hud('כתבו את השם שלכם',true);return}await be.signIn(n)},
  'post-form':async()=>{const text=(S.drafts.post||'').trim();if(!text&&!S.img)return;S.busy=true;updateSend();render();
    try{await be.addPost(S.gid,{text:text,image:S.img});S.drafts.post='';S.img=null;haptic(12);hud('פורסם')}catch(e){fail(e)}finally{S.busy=false;render()}},
  'chat-form':async()=>{const t=(S.drafts.chat||'').trim();if(!t)return;S.drafts.chat='';const el=$('#chat-in');if(el){el.value='';grow(el)}updateSend();
    try{await be.sendMessage(S.gid,t);markSeen()}catch(e){S.drafts.chat=t;fail(e);render()}},
  'cmt-form':async f=>{const el=f.querySelector('#cmt-in'),t=el.value.trim();if(!t||!S.comments)return;el.value='';grow(el);try{await be.addComment(S.gid,S.comments.pid,t)}catch(e){el.value=t;fail(e)}},
  'name-form':async()=>{const n=$('#pf-name').value.trim();if(!n){hud('השם לא יכול להיות ריק',true);return}try{await be.saveProfile({name:n});S.user.name=n;S.members[S.user.id]=Object.assign({},S.members[S.user.id],{name:n});hud('השם נשמר');render()}catch(e){fail(e)}}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=F[e.target.id];if(f)f(e.target)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.draft){S.drafts[el.dataset.draft]=el.value;updateSend()}if(el.tagName==='TEXTAREA')grow(el)});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&!e.shiftKey&&t&&(t.id==='chat-in'||t.id==='cmt-in')&&!e.isComposing){e.preventDefault();t.form.requestSubmit()}
  if(e.key==='Escape'){if(S.viewer)A['viewer-close']();else if(closeForm)closeForm();else{const c=sheetEl.querySelector('.cancel');if(c)c.click()}}
  if(S.viewer&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){A['viewer-step']({dataset:{v:e.key==='ArrowLeft'?'1':'-1'}})}
});
fileEl.addEventListener('change',async()=>{
  const files=[...fileEl.files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  if(S.pickFor==='post'){try{S.img=await prepImage(files[0]);render();const t=$('#post-text');if(t)t.focus({preventScroll:true})}catch(e){hud('לא הצלחנו לפתוח את התמונה',true)}return}
  hud(files.length===1?'מעלה תמונה…':`מעלה ${files.length} תמונות…`);
  try{const imgs=[];for(const f of files)imgs.push(await prepImage(f));await be.addPhotos(S.gid,imgs);haptic(12);hud(imgs.length===1?'התמונה נוספה':`${imgs.length} תמונות נוספו`)}catch(e){fail(e)}
});

function clock(){const el=$('#sb-time');if(el){const d=new Date();el.textContent=d.getHours()+':'+pad(d.getMinutes())}}
clock();setInterval(clock,30000);
setInterval(()=>{if(!typing()&&!closeForm&&!S.viewer)softRender()},60000);
if(onSite&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){}}

/* ---------- boot ---------- */
async function boot(){
  render(true);
  const live=FIREBASE_CONFIG&&onSite&&!params.has('demo');
  try{be=live?await LiveBackend(FIREBASE_CONFIG):DemoBackend()}catch(e){console.error(e);be=DemoBackend();hud('לא הצלחנו להתחבר לשרת. מציגים דמו.',true)}
  be.onAuth(u=>{
    S.booting=false;S.user=u;
    if(!u){closeGroup();if(unsubGroups)unsubGroups();unsubGroups=null;S.groups=[];S.screen='groups';S.anim='fade';render(true);return}
    S.members[u.id]=u;watchGroups();S.anim='fade';render(true);
    if(S.joinCode){const c=S.joinCode;S.joinCode='';setTimeout(()=>joinForm(c),400)}
  });
}
try{history.replaceState({screen:'groups'},'')}catch(e){}
boot();
</script>
